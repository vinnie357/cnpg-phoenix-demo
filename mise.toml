[tools]
erlang = "28.5.0.8"
elixir = "1.19.6-otp-28"
"github:nushell/nushell" = "0.116.1"
gitleaks = "8.30.1"

[tasks.setup]
description = "Fetch deps and compile"
run = "mix deps.get && mix compile"

[tasks.deps]
description = "Fetch Mix dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile with warnings-as-errors"
run = "mix compile --warnings-as-errors"

[tasks.test]
description = "Run the test suite"
run = "mix test"

[tasks.format-check]
description = "Check that source is formatted"
depends = ["deps"]
run = "mix format --check-formatted"

[tasks."audit:hex"]
description = "Run mix hex.audit on Hex >= 2.5.3; fail on any advisory or retirement not allow-listed in mix.exs, a stale allow-list entry, or a registry cache fallback. Needs network."
depends = ["deps"]
run = "nu scripts/hex-audit.nu"

[tasks."audit:deps"]
description = "Run mix deps.audit (mix_audit) unfiltered; fail on unskipped or stale .mix-audit-ignore entries, a missing or unreadable mix.lock, an empty advisory DB, or a blind positive control. Needs network."
depends = ["audit:hex"]
run = "nu scripts/deps-audit.nu"

[tasks."audit:advisory-doc"]
description = "Fail when a docs/security/advisory-exceptions.md section's Next review date is overdue, missing or unparseable"
run = "nu scripts/advisory-doc.nu"

[tasks."test:hex-audit"]
description = "Fixture tests for scripts/hex-audit.nu"
run = "nu test/test-hex-audit.nu"

[tasks."test:hex-audit-offline"]
description = "audit:hex must fail on a registry cache fallback and force HEX_OFFLINE=false"
run = "nu test/test-hex-audit-offline.nu"

[tasks."test:deps-audit"]
description = "Fixture and fake-mix tests for scripts/deps-audit.nu"
run = "nu test/test-deps-audit.nu"

[tasks."test:audit-wiring"]
description = "Audit task wiring, allow-list parity between mix.exs and .mix-audit-ignore, and the exceptions doc structure"
run = "nu test/test-audit-wiring.nu"

[tasks."test:advisory-doc"]
description = "Tests for scripts/advisory-doc.nu"
run = "nu test/test-advisory-doc.nu"

[tasks.ci]
description = "Full quality gate: format check, audits and audit tests (parallel), then compile (warnings-as-errors), then tests"
depends = ["format-check", "audit:hex", "audit:deps", "audit:advisory-doc", "test:hex-audit", "test:hex-audit-offline", "test:deps-audit", "test:audit-wiring", "test:advisory-doc"]
# compile runs here, not in depends: mix deps.audit compiles deps and would race it on _build.
run = ["mise run compile", "mix test --warnings-as-errors"]
